# Configuración de la sala. Se edita desde el panel o a mano.
nombre: La Madriguera Trading
pares:
- XBTEUR
- ETHEUR
intervalo_minutos: 1
hora_parte: '08:00'
alertas:
  volumen_x: 3
  enfriamiento_minutos: 30
  minimo_velas_dia: 30
conservar_dias: 400
automatico:
  velas: true
  alertas: true
  parte: true
  analisis: true
# Análisis de cada día con IA (python app.py analisis). noticias: busca 1 noticia fechada por mercado
analisis:
  noticias: true
  hora: '08:00'
# Histórico de Kraken: python app.py historico
historico:
  intervalos:
  - 1
  - 60
  - 1440
  dias_trades: 90
  max_llamadas_panel: 300
  volcar_cada: 50
  hueco_min_minutos: 60
# Backtest: comisión taker de Kraken Pro 0,40 % (maker 0,25); cámbiala si operas con limitadas
backtest:
  capital_inicial: 10000
  comision_pct: 0.4
  deslizamiento_pct: 0.05
  deslizamiento_stop_pct: 0.1
  minimo_orden_eur: 10
  riesgo_pct: 1.0
  tope_activo_pct: 30
  parada_dia_pct: 3
  apagado_pct: 12
  stop_min_pct: 0.3
  dia: local
  ventana_is_dias: 180
  ventana_oos_dias: 60
  oos_min_dias: 30
  ventana_is_dias_diario: 730
  ventana_oos_dias_diario: 182
  oos_min_dias_diario: 90
  ventanas_minimas: 4
  min_operaciones_is: 30
  hueco_max_dias: 7
  semillas_azar: 200
  semillas_azar_panel: 50
  max_operaciones_guardadas: 5000
  puertas:
    expectativa_min: 0
    profit_factor_min: 1.3
    drawdown_max_pct: 20
    operaciones_min: 100
    p_azar_max: 0.05
    consistencia_min: 0.5
# Portada fácil: mercados tradicionales de Yahoo Finance (solo mirar). clave, nombre, simbolo, moneda, tipo
mercados_extra:
- {clave: sp500, nombre: S&P 500, simbolo: '^GSPC', moneda: USD, tipo: indice}
- {clave: ibex35, nombre: IBEX 35, simbolo: '^IBEX', moneda: EUR, tipo: indice}
- {clave: oro, nombre: Oro, simbolo: 'GC=F', moneda: USD, tipo: metal}
- {clave: plata, nombre: Plata, simbolo: 'SI=F', moneda: USD, tipo: metal}
- {clave: brent, nombre: Petróleo Brent, simbolo: 'BZ=F', moneda: USD, tipo: materia_prima}
- {clave: tesla, nombre: Tesla, simbolo: 'TSLA', moneda: USD, tipo: accion}
# Backtest de bolsa: histórico diario largo de Yahoo Finance (python app.py historico yahoo). Solo para backtest, no se opera
mercados_backtest:
- {par: SPX500, nombre: S&P 500, simbolo: '^GSPC', moneda: USD}
- {par: IBEX35, nombre: IBEX 35, simbolo: '^IBEX', moneda: EUR}
- {par: OROUSD, nombre: Oro, simbolo: 'GC=F', moneda: USD}
- {par: PLATAUSD, nombre: Plata, simbolo: 'SI=F', moneda: USD}
- {par: BRENTUSD, nombre: Petróleo Brent, simbolo: 'BZ=F', moneda: USD}
- {par: TSLAUSD, nombre: Tesla, simbolo: 'TSLA', moneda: USD}
# Costes por mercado (% por lado). Sin entrada: los de backtest (Kraken taker 0,40 %). Bolsa: bróker barato de la UE
costes:
  SPX500: {comision_pct: 0.1, deslizamiento_pct: 0.05, deslizamiento_stop_pct: 0.1}
  IBEX35: {comision_pct: 0.1, deslizamiento_pct: 0.05, deslizamiento_stop_pct: 0.1}
  OROUSD: {comision_pct: 0.1, deslizamiento_pct: 0.05, deslizamiento_stop_pct: 0.1}
  PLATAUSD: {comision_pct: 0.1, deslizamiento_pct: 0.05, deslizamiento_stop_pct: 0.1}
  BRENTUSD: {comision_pct: 0.1, deslizamiento_pct: 0.05, deslizamiento_stop_pct: 0.1}
  TSLAUSD: {comision_pct: 0.1, deslizamiento_pct: 0.05, deslizamiento_stop_pct: 0.1}
